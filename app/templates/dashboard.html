<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yönetim Paneli | Big Heart's Little Club</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&family=Nunito:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --mercan: #F25C78; --lacivert: #26355D; --sari: #FFC94A; --krem: #F7F9FC; --soluk: #5A6584; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Nunito', system-ui, sans-serif; background: var(--krem); color: var(--lacivert); }
    .kapsayici { max-width: 1120px; margin: 0 auto; padding: 24px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; gap: 12px; flex-wrap: wrap; }
    h1 { font-family: 'Baloo 2', sans-serif; font-size: 1.6rem; margin: 0; }
    .ozet { color: var(--soluk); margin-top: 4px; }
    button { font: inherit; background: var(--lacivert); color: #fff; border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; }
    button:focus-visible { outline: 3px solid var(--sari); outline-offset: 2px; }
    .tablo-sarmal { overflow-x: auto; background: #fff; border-radius: 14px; border: 1px solid #dfe4ef; }
    table { width: 100%; border-collapse: collapse; min-width: 720px; }
    th, td { text-align: left; padding: 12px 16px; border-bottom: 1px solid #eef1f7; vertical-align: top; }
    th { font-size: .85rem; color: var(--soluk); font-weight: 600; background: #f9fafd; }
    td.isim { font-weight: 600; }
    td.hizmet span { background: #fde7ec; color: #a8213f; border-radius: 999px; padding: 2px 10px; font-size: .85rem; }
    tr:last-child td { border-bottom: 0; }
    .bos { padding: 32px; text-align: center; color: var(--soluk); }
  </style>
</head>
<body>
  <div class="kapsayici">
    <header>
      <div>
        <h1>Veli talepleri</h1>
        <div class="ozet" id="ozet">Yükleniyor…</div>
      </div>
      <button id="yenileButton">Listeyi yenile</button>
    </header>

    <div class="tablo-sarmal">
      <table>
        <thead>
          <tr><th>Veli adı</th><th>Telefon</th><th>Çocuğun yaşı</th><th>Hizmet</th><th>Not</th><th>Tarih</th></tr>
        </thead>
        <tbody id="leadTablosu"></tbody>
      </table>
    </div>
  </div>

  <script>
    const tablo = document.getElementById('leadTablosu');
    const ozet = document.getElementById('ozet');

    function hucre(metin, sinif) {
      const td = document.createElement('td');
      if (sinif) td.className = sinif;
      td.textContent = metin || '–';
      return td;
    }

    async function leadleriGetir() {
      ozet.textContent = 'Yükleniyor…';
      try {
        const yanit = await fetch('/api/leads');
        const veri = await yanit.json();
        tablo.innerHTML = '';

        if (!veri.basari) {
          ozet.textContent = veri.hata;
          return;
        }
        if (veri.leadler.length === 0) {
          ozet.textContent = 'Henüz talep yok.';
          tablo.innerHTML = '<tr><td class="bos" colspan="6">Karşılama sayfasındaki formdan gelen talepler burada görünecek.</td></tr>';
          return;
        }

        ozet.textContent = 'Toplam ' + veri.toplam + ' talep';
        veri.leadler.forEach(function (lead) {
          const tr = document.createElement('tr');
          tr.appendChild(hucre(lead.isim, 'isim'));
          tr.appendChild(hucre(lead.telefon));
          tr.appendChild(hucre(lead.cocuk_yasi));
          const hizmetHucresi = document.createElement('td');
          hizmetHucresi.className = 'hizmet';
          if (lead.hizmet) {
            const etiket = document.createElement('span');
            etiket.textContent = lead.hizmet;
            hizmetHucresi.appendChild(etiket);
          } else {
            hizmetHucresi.textContent = '–';
          }
          tr.appendChild(hizmetHucresi);
          tr.appendChild(hucre(lead.mesaj));
          tr.appendChild(hucre(lead.tarih));
          tablo.appendChild(tr);
        });
      } catch (e) {
        ozet.textContent = 'Sunucuya ulaşılamadı.';
      }
    }

    document.getElementById('yenileButton').addEventListener('click', leadleriGetir);
    leadleriGetir();
  </script>
</body>
</html>
